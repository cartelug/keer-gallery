name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Syntax-check scripts
        run: npm run check

      - name: Ensure prerendered pages are up to date
        run: |
          npm run build:art
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated artwork pages/sitemap are out of date. Run 'npm run build:art' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          node tools/serve.mjs &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/index.html >/dev/null && break
            sleep 1
          done

      - name: Run end-to-end tests
        env:
          BASE_URL: http://localhost:8080
        run: npm test
