name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/keer-gallery-completion-fhrui3", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Keep generated artwork pages + sitemap in sync before publishing
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Prerender artwork pages
        run: node tools/prerender.mjs

      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
