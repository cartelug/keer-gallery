<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Keer Art Gallery</title>
<meta name="robots" content="noindex">
<meta name="description" content="The page you're looking for can't be found. Explore available works or commission a custom artwork with Keer Art Gallery.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="css/style.css">
<meta name="theme-color" content="#0a0a0a">
<link rel="apple-touch-icon" href="assets/logo-gold-framed.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap">
<style>
  .err {
    min-height: 100vh; background: var(--true-black); color: var(--white);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 2rem; position: relative; overflow: hidden;
  }
  .err-glow { position: absolute; width: 800px; height: 800px; top: 50%; left: 50%;
    transform: translate(-50%,-50%); background: radial-gradient(circle, rgba(201,162,77,0.1) 0%, transparent 60%); pointer-events: none; }
  .err img { width: 90px; height: 90px; object-fit: contain; margin-bottom: 2rem; position: relative; z-index: 2; }
  .err-code { font-family: var(--serif); font-size: clamp(5rem, 18vw, 10rem); line-height: 1; color: var(--gold); position: relative; z-index: 2; }
  .err-title { font-family: var(--serif); font-size: clamp(1.6rem, 4vw, 2.4rem); margin: 0.5rem 0 1rem; position: relative; z-index: 2; }
  .err-text { color: rgba(255,255,255,0.5); max-width: 420px; line-height: 1.8; margin-bottom: 2.5rem; position: relative; z-index: 2; }
  .err-actions { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; position: relative; z-index: 2; }
</style>
</head>
<body>
<section class="err">
  <div class="err-glow"></div>
  <img src="assets/logo-gold.png" alt="Keer Art Gallery">
  <div class="err-code">404</div>
  <h1 class="err-title">This page has wandered off</h1>
  <p class="err-text">The page you're looking for doesn't exist or has moved. Let's get you back to the art.</p>
  <div class="err-actions">
    <a href="index.html" class="btn btn-gold">Return Home</a>
    <a href="works.html" class="btn btn-outline-gold">View Works</a>
  </div>
</section>
</body>
</html>
